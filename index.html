<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>悪い子にゃんこチェック</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0d0d12;--card:#16161f;--line:#2a2a3a;--neon:#ff2d6a;--neon2:#00f0ff;--neon3:#c9a0ff;--text:#e8e8f0;--muted:#8888a0;--check:#00f0ff;--done:#1a2a22;--month:#ffa86b;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overscroll-behavior:none;overscroll-behavior-y:none;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
body{padding:10px 12px 80px;max-width:480px;margin:0 auto;line-height:1.4}
h1{text-align:center;font-size:1.15rem;color:var(--neon);text-shadow:0 0 10px rgba(255,45,106,.45);margin-bottom:2px}.title-row{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:8px;min-height:1.6em}.title-row h1{margin:0;text-align:center}.ver{position:absolute;right:0;top:50%;transform:translateY(-50%);font:700 0.6rem/1 ui-monospace,monospace;color:var(--neon3);text-decoration:none;opacity:.75;letter-spacing:.03em;padding:2px 5px;border:1px solid #3a2a4a;border-radius:5px}.ver:active{color:var(--neon2);border-color:var(--neon2)}
.game{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.ghead{display:flex;align-items:center;gap:6px;padding:4px 10px;background:linear-gradient(90deg,#1a1220,#12121a);border-bottom:1px solid transparent;touch-action:manipulation}
.game.open .ghead{border-bottom-color:var(--line)}
.gname{font-weight:700;color:var(--neon);font-size:.95rem;cursor:pointer;flex-shrink:0;max-width:48%;padding:6px 4px 6px 0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.gname:active{opacity:.8}
.gexpand{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:6px;min-height:40px;min-width:48px;padding:6px 2px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
.gmeta{font-size:.62rem;color:var(--muted);text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:4px;flex-wrap:wrap}
.gmeta .badge{font-size:.55rem}
.gactions{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:6px 8px 10px}
.gactions .ggear{justify-self:start}
.gactions .gexpandall{justify-self:center;font-size:.62rem;padding:4px 12px;border-radius:8px;border:1px solid #2a2a3a;background:#12121a;color:var(--neon3);cursor:pointer;-webkit-tap-highlight-color:transparent}
.gactions .gexpandall:active{border-color:var(--neon3);opacity:.9}
.gactions .gaa{justify-self:end;font-size:.75rem;color:var(--muted);background:none;border:none;cursor:pointer;padding:4px 2px;-webkit-tap-highlight-color:transparent}
.gactions .gaa:active{color:var(--neon2)}
.chev{color:var(--neon3);font-size:.75rem;transition:transform .2s;opacity:.85}
.game.open .chev{transform:rotate(180deg)}
.gbody{display:none;padding-bottom:4px}
.game.open .gbody{display:block}
.acc{padding:8px 10px;border-bottom:2px solid #2a2a3a;margin:0}
.acc:last-child{border-bottom:none}
.acc.done{background:var(--done)}
.acc.open{background:#12121c;border-radius:10px;margin:6px 0;border:1px solid #2e2e42;border-bottom:1px solid #2e2e42;box-shadow:inset 0 0 0 1px #1a1a28}
.acc.open + .acc{margin-top:4px}
.ahead{display:flex;justify-content:space-between;align-items:center;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:32px;gap:6px}
.acc.open .ahead{margin-bottom:6px;padding-bottom:4px;border-bottom:1px dashed #2a2a3a}
.abody{display:none;contain:layout style;padding-top:2px}
.acc.open .abody{display:block}
.gbody{contain:content}
.achev{color:var(--neon3);font-size:.7rem;opacity:.7;transition:transform .15s;flex-shrink:0}
.acc.open .achev{transform:rotate(90deg)}
.ainfo{min-width:0;flex:1}
.aname{font-weight:600;color:var(--neon3);font-size:.9rem;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.anote{font-size:.68rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:1px 0}
.anote:not([hidden]){cursor:pointer}
.anote:active{color:var(--neon3)}
.acc.open .anote{display:none}
.badge{font-size:.58rem;background:var(--neon2);color:#0d0d12;padding:1px 5px;border-radius:6px;font-weight:700}
.badge.week{background:#c9a0ff}
.badge.month{background:var(--month);color:#1a1008}
.aactions{display:flex;gap:1px;flex-shrink:0}
.checks-wrap{display:grid;gap:6px 10px;margin-top:2px}
.checks-wrap.cols-1{grid-template-columns:1fr}
.checks-wrap.cols-2{grid-template-columns:1fr 1fr}
.checks-wrap.cols-3{grid-template-columns:1fr 1fr 1fr;gap:6px 8px}
@media (max-width:380px){.checks-wrap.cols-3{grid-template-columns:1fr 1fr}.checks-wrap.cols-3 .col.m{grid-column:1/-1}}
.col-label{font-size:.62rem;font-weight:700;letter-spacing:.04em;margin-bottom:4px;opacity:.9;padding-left:26px}
.col-label.d{color:var(--neon2)}
.col-label.w{color:#d4a8ff;text-shadow:0 0 6px rgba(201,160,255,.35)}
.col-label.m{color:var(--month);text-shadow:0 0 6px rgba(255,168,107,.35)}
.col-list{display:flex;flex-direction:column;gap:8px}
.ci{
  display:flex;align-items:center;gap:8px;
  min-height:28px;padding:3px 0;
  line-height:1.3;font-size:.8rem;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.ci input{
  width:18px;height:18px;margin:0;flex-shrink:0;
  accent-color:var(--check);cursor:pointer;
}
.ci.weekly input{accent-color:#c9a0ff}
.ci.monthly input{accent-color:var(--month)}
.ci.done{color:var(--muted);text-decoration:line-through}
.ci.weekly{color:#e0c8ff}
.ci.weekly.done{color:#6a5a7a}
.ci.monthly{color:#ffd0a8}
.ci.monthly.done{color:#7a5a40}
.ci .lbl{word-break:break-word;flex:1;min-width:0;line-height:1.35}
.note-sep{height:1px;margin:8px 0 6px;background:linear-gradient(90deg,transparent,#c9a0ff66,transparent);border:0}
.note-preview{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.fab{position:fixed;bottom:18px;right:18px;width:52px;height:52px;border-radius:50%;background:var(--neon);color:#fff;border:none;font-size:1.6rem;box-shadow:0 0 18px rgba(255,45,106,.5);z-index:40}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.mb{background:#14141e;width:100%;max-width:480px;border-radius:14px 14px 0 0;padding:14px;max-height:90vh;overflow-y:auto;border-top:1px solid var(--neon)}
.mb h2{color:var(--neon);font-size:1rem;margin-bottom:8px}
input[type=text],input[type=time],input[type=number],select,textarea{width:100%;padding:8px;border:1px solid #2a2a3a;border-radius:8px;background:#0d0d14;color:var(--text);font-size:.9rem;margin-bottom:7px;font-family:inherit}
input:disabled,select:disabled{opacity:.4}
textarea{min-height:160px;resize:vertical}
label.s{font-size:.7rem;color:var(--muted);display:block;margin-bottom:2px}
.row{display:flex;gap:6px;margin-bottom:7px}.row>*{flex:1}
.btns{display:flex;gap:6px;margin-top:10px}
.btns button{flex:1;padding:10px;border:none;border-radius:9px;font-weight:600;font-size:.9rem}
.save{background:var(--neon);color:#fff}.cancel{background:#222230;color:var(--text)}
.danger-zone{margin-top:18px;padding-top:14px;border-top:1px solid #3a2030}
.danger{background:#ff2d2d;color:#fff;width:100%;padding:9px;border:none;border-radius:9px;font-weight:600;opacity:.92}
.ib{background:none;border:none;color:var(--muted);font-size:.95rem;padding:2px 4px;cursor:pointer}
.ib:active{color:var(--neon2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:5px}.g2 label.s{grid-column:1/-1}
.hint{font-size:.65rem;color:var(--muted);margin:-4px 0 8px}
.nhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.nhead h2{margin:0;flex:1;min-width:0}
.nclear{flex-shrink:0;font-size:.62rem;padding:4px 8px;border-radius:6px;border:1px solid #3a2030;background:#1a1018;color:#ff8aa8;cursor:pointer;-webkit-tap-highlight-color:transparent}
.nclear:active{background:#2a1520}
</style>
</head>
<body>
<div class="title-row">
  <h1>♡ 悪い子にゃんこチェック ♡</h1>
  <a class="ver" href="update.html" title="タップで最新版に更新">v0.5.11</a>
</div>
<div id="root"></div>
<button class="fab" id="fab" title="ゲームを追加">＋</button>

<div class="modal" id="gModal">
  <div class="mb">
    <h2 id="gTitle">ゲームを追加</h2>
    <label class="s">ゲーム名</label>
    <input type="text" id="gName" placeholder="例：原神">
    <label class="s">日課リセット時刻</label>
    <input type="time" id="gDaily" value="05:00">
    <div id="gWeeklyBlock">
      <label class="s">週課リセット（曜日＋時刻）</label>
      <div class="row">
        <select id="gWDay">
          <option value="1">月曜</option><option value="2">火曜</option><option value="3">水曜</option>
          <option value="4">木曜</option><option value="5">金曜</option><option value="6">土曜</option><option value="0">日曜</option>
        </select>
        <input type="time" id="gWTime" value="05:00">
      </div>
      <p class="hint" id="gWeeklyHint" hidden>ウィークリー未設定のため変更できません</p>
    </div>
    <div id="gMonthlyBlock">
      <label class="s">月課リセット（日付＋時刻）</label>
      <div class="row">
        <input type="number" id="gMDay" min="1" max="28" value="1" placeholder="日">
        <input type="time" id="gMTime" value="05:00">
      </div>
      <p class="hint" id="gMonthlyHint" hidden>マンスリー未設定のため変更できません</p>
    </div>
    <div class="btns">
      <button class="cancel" id="gCancel">キャンセル</button>
      <button class="save" id="gSave">保存</button>
    </div>
    <div class="danger-zone" id="gDelZone" style="display:none">
      <button class="danger" id="gDel">このゲームを削除</button>
    </div>
  </div>
</div>

<div class="modal" id="aModal">
  <div class="mb">
    <h2 id="aTitle">アカウントを追加</h2>
    <label class="s">アカウント名</label>
    <input type="text" id="aName" placeholder="例：本アカ">
    <div class="g2">
      <label class="s">デイリー（空欄は非表示・最大5）</label>
      <input type="text" id="d1" placeholder="①"><input type="text" id="d2" placeholder="②">
      <input type="text" id="d3" placeholder="③"><input type="text" id="d4" placeholder="④">
      <input type="text" id="d5" placeholder="⑤">
    </div>
    <div class="g2">
      <label class="s">ウィークリー（空欄は非表示・最大2）</label>
      <input type="text" id="w1" placeholder="①"><input type="text" id="w2" placeholder="②">
    </div>
    <div class="g2">
      <label class="s">マンスリー（空欄は非表示・最大2）</label>
      <input type="text" id="m1" placeholder="①"><input type="text" id="m2" placeholder="②">
    </div>
    <div class="btns">
      <button class="cancel" id="aCancel">キャンセル</button>
      <button class="save" id="aSave">保存</button>
    </div>
    <div class="danger-zone" id="aDelZone" style="display:none">
      <button class="danger" id="aDel">このアカウントを削除</button>
    </div>
  </div>
</div>

<div class="modal" id="nModal">
  <div class="mb">
    <div class="nhead">
      <h2 id="nTitle">アカウントメモ</h2>
      <button type="button" class="nclear" id="nClear" title="メモをすべて消す">オールクリア</button>
    </div>
    <textarea id="notes" placeholder="このアカウント用のメモ…"></textarea>
    <div class="btns">
      <button class="cancel" id="nCancel">閉じる</button>
      <button class="save" id="nSave">保存</button>
    </div>
  </div>
</div>

<script type="module">
import { escape, gameHasWeekly, gameHasMonthly } from './core.mjs';
import { load, save, applyResets } from './store.mjs';

let state = load();
// 展開は起動のたびに閉じる（保存しない）
state.expanded = {};
let gameOpen = {};
let accOpen = {};
let editG = null, editA = null, parentG = null, noteTarget = null;

function isDone(a) {
  const ds = (a.daily || []).filter(c => c.label);
  return ds.length > 0 && ds.every(c => c.done);
}
function isWeekDone(a) {
  const ws = (a.weekly || []).filter(c => c.label);
  return ws.length > 0 && ws.every(c => c.done);
}
function isMonthDone(a) {
  const ms = (a.monthly || []).filter(c => c.label);
  return ms.length > 0 && ms.every(c => c.done);
}
function gameDailyAllOk(g) {
  const list = (g.accounts || []).filter(accHasDaily);
  return list.length > 0 && list.every(isDone);
}
function gameWeeklyAllOk(g) {
  const list = (g.accounts || []).filter(accHasWeekly);
  return list.length > 0 && list.every(isWeekDone);
}
function gameMonthlyAllOk(g) {
  const list = (g.accounts || []).filter(accHasMonthly);
  return list.length > 0 && list.every(isMonthDone);
}
function syncGameHeader(g) {
  const root = document.getElementById('root');
  const meta = root.querySelector('[data-gmeta="' + g.id + '"]');
  if (meta) {
    const bits = [];
    if (gameDailyAllOk(g)) bits.push('<span class="badge">日課OK</span>');
    if (gameWeeklyAllOk(g)) bits.push('<span class="badge week">週課OK</span>');
    if (gameMonthlyAllOk(g)) bits.push('<span class="badge month">月課OK</span>');
    const html = bits.join('');
    if (meta.innerHTML !== html) meta.innerHTML = html;
  }
}
function accHasMonthly(a) {
  return (a.monthly || []).some(c => c.label);
}
function accHasWeekly(a) {
  return (a.weekly || []).some(c => c.label);
}
function accHasDaily(a) {
  return (a.daily || []).some(c => c.label);
}

const SEP_COLORS = ['#ff2d6a66','#00f0ff66','#c9a0ff66','#ffa86b66','#5ce1e666','#ff6bcb66','#a0ff9e66','#ffd16666'];

function buildChecksHtml(g, a) {
  const dList = (a.daily||[]).filter(c=>c.label).map((c,i)=>
    `<label class="ci" data-ci="${g.id}|${a.id}|d|${i}"><input type="checkbox" data-t="${g.id}|${a.id}|d|${i}" ${c.done?'checked':''}><span class="lbl">${escape(c.label)}</span></label>`).join('');
  const wList = (a.weekly||[]).filter(c=>c.label).map((c,i)=>
    `<label class="ci weekly" data-ci="${g.id}|${a.id}|w|${i}"><input type="checkbox" data-t="${g.id}|${a.id}|w|${i}" ${c.done?'checked':''}><span class="lbl">${escape(c.label)}</span></label>`).join('');
  const mList = (a.monthly||[]).filter(c=>c.label).map((c,i)=>
    `<label class="ci monthly" data-ci="${g.id}|${a.id}|m|${i}"><input type="checkbox" data-t="${g.id}|${a.id}|m|${i}" ${c.done?'checked':''}><span class="lbl">${escape(c.label)}</span></label>`).join('');
  let checks = '';
  if (dList || wList || mList) {
    const parts = [];
    if (dList) parts.push(`<div class="col d"><div class="col-label d">デイリー</div><div class="col-list">${dList}</div></div>`);
    if (wList) parts.push(`<div class="col w"><div class="col-label w">ウィークリー</div><div class="col-list">${wList}</div></div>`);
    if (mList) parts.push(`<div class="col m"><div class="col-label m">マンスリー</div><div class="col-list">${mList}</div></div>`);
    checks = `<div class="checks-wrap ${colClass(a)}">${parts.join('')}</div>`;
  }
  const noteLines = (a.note||'').trim().split(/\n/);
  const noteHead = noteLines[0] || '';
  const noteRest = noteLines.slice(1).join(' ').trim();
  const noteSep = noteHead ? '' : ' hidden';
  const notePrev = noteHead
    ? `<div class="note-preview" data-noteprev="${g.id}|${a.id}"><strong>📝 ${escape(noteHead)}</strong>${noteRest ? ' — ' + escape(noteRest.slice(0,40)) : ''}</div>`
    : `<div class="note-preview" data-noteprev="${g.id}|${a.id}" hidden></div>`;
  return `${checks}<div class="note-sep" data-notesep="${g.id}|${a.id}"${noteSep}></div>${notePrev}`;
}

function ensureAccBody(g, a) {
  const key = g.id + '|' + a.id;
  const box = document.querySelector('[data-abody="' + key + '"]');
  if (!box || box.dataset.ready === '1') return box;
  box.innerHTML = buildChecksHtml(g, a);
  box.dataset.ready = '1';
  return box;
}

function colClass(a) {
  const hasM = accHasMonthly(a);
  const hasW = accHasWeekly(a);
  if (hasM && hasW) return 'cols-3';
  if (hasM || hasW) return 'cols-2';
  return 'cols-1';
}

function render(forceStructure = false) {

  const root = document.getElementById('root');
  const sig = state.games.map(g => g.id + ':' + (g.accounts||[]).map(a => a.id).join(',')).join('|')
    + '|' + state.games.map(g => (g.accounts||[]).map(a =>
      ['daily','weekly','monthly'].map(k => (a[k]||[]).filter(c=>c.label).map(c=>c.label).join(',')).join('/')
    ).join(';')).join('#');
  const needStructure = forceStructure || root.dataset.sig !== sig || !state.games.length;

  if (!state.games.length) {
    root.dataset.sig = '';
    root.innerHTML = '<div class="empty">まだゲームがないよ…<br>右下の＋から追加してね♡</div>';
    return;
  }

  if (needStructure) {
    root.dataset.sig = sig;
    root.innerHTML = state.games.map(g => {
      return `
    <div class="game" data-gid="${g.id}">
      <div class="ghead">
        <div class="gname" data-toggle="${g.id}">${escape(g.name)}</div>
        <div class="gexpand" data-toggle="${g.id}">
          <span class="gmeta" data-gmeta="${g.id}"></span>
          <span class="chev" aria-hidden="true">♡</span>
        </div>
      </div>
      <div class="gbody">
        ${(g.accounts||[]).map((a, ai) => {
          const sep = SEP_COLORS[ai % SEP_COLORS.length];
          return `<div class="acc" data-aid="${g.id}|${a.id}" style="border-bottom-color:${sep}">
            <div class="ahead" data-atoggle="${g.id}|${a.id}">
              <div class="ainfo">
                <div class="aname">${escape(a.name)}
                  <span class="badge" data-bdaily="${g.id}|${a.id}" hidden>今日OK</span>
                  <span class="badge week" data-bweek="${g.id}|${a.id}" hidden>週OK</span>
                  <span class="badge month" data-bmonth="${g.id}|${a.id}" hidden>月OK</span>
                </div>
                <div class="anote" data-anote="${g.id}|${a.id}" hidden></div>
              </div>
              <div class="aactions">
                <button class="ib" data-note="${g.id}|${a.id}" title="メモ">📝</button>
                <button class="ib" data-ea="${g.id}|${a.id}" title="編集">✏️</button>
                <span class="achev" aria-hidden="true">›</span>
              </div>
            </div>
            <div class="abody" data-abody="${g.id}|${a.id}"></div>
          </div>`;
        }).join('')}
        <div class="gactions">
          <button type="button" class="ib ggear" data-eg="${g.id}" title="ゲーム設定">⚙️</button>
          <button type="button" class="gexpandall" data-eall="${g.id}">全展開</button>
          <button type="button" class="gaa" data-aa="${g.id}" title="アカウント追加">＋ アカウント</button>
        </div>
      </div>
    </div>`;
    }).join('');
  }

  // メモリ上の開閉だけ反映（保存しない）
  state.games.forEach(g => {
    const el = root.querySelector(`[data-gid="${g.id}"]`);
    if (el) {
      const want = !!gameOpen[g.id];
      if (el.classList.contains('open') !== want) el.classList.toggle('open', want);
    }
    (g.accounts||[]).forEach(a => {
      const key = g.id + '|' + a.id;
      const acc = root.querySelector(`[data-aid="${key}"]`);
      if (!acc) return;
      const want = !!accOpen[key];
      if (acc.classList.contains('open') !== want) acc.classList.toggle('open', want);
    });
  });

  state.games.forEach(g => {
    syncGameHeader(g);
    (g.accounts||[]).forEach(a => {
      const key = g.id + '|' + a.id;
      const done = isDone(a);
      const weekDone = isWeekDone(a);
      const monthDone = isMonthDone(a);
      const acc = root.querySelector(`[data-aid="${key}"]`);
      if (acc) acc.classList.toggle('done', done);
      const bd = root.querySelector(`[data-bdaily="${key}"]`);
      const bw = root.querySelector(`[data-bweek="${key}"]`);
      const bm = root.querySelector(`[data-bmonth="${key}"]`);
      if (bd) bd.hidden = !done;
      if (bw) bw.hidden = !weekDone;
      if (bm) bm.hidden = !monthDone;
      const noteLines = (a.note||'').trim().split(/\n/);
      const noteHead = noteLines[0] || '';
      const noteRest = noteLines.slice(1).join(' ').trim();
      const an = root.querySelector(`[data-anote="${key}"]`);
      if (an) {
        const want = noteHead ? ('📝 ' + noteHead) : '';
        if (noteHead) {
          if (an.hidden || an.textContent !== want) {
            an.hidden = false;
            an.textContent = want;
          }
        } else if (!an.hidden) {
          an.hidden = true;
          an.textContent = '';
        }
      }
      // 未展開のアカウントはチェックDOMがないので触らない
      const body = root.querySelector(`[data-abody="${key}"]`);
      if (!body || body.dataset.ready !== '1') return;
      [['daily','d'],['weekly','w'],['monthly','m']].forEach(([field, prefix]) => {
        (a[field]||[]).forEach((c, i) => {
          if (!c.label) return;
          const lab = root.querySelector(`[data-ci="${key}|${prefix}|${i}"]`);
          if (!lab) return;
          const inp = lab.querySelector('input');
          if (inp && inp.checked !== !!c.done) inp.checked = !!c.done;
          lab.classList.toggle('done', !!c.done);
        });
      });
      const np = root.querySelector(`[data-noteprev="${key}"]`);
      const ns = root.querySelector(`[data-notesep="${key}"]`);
      if (np) {
        if (noteHead) {
          np.hidden = false;
          np.innerHTML = `<strong>📝 ${escape(noteHead)}</strong>${noteRest ? ' — ' + escape(noteRest.slice(0,40)) : ''}`;
          if (ns) ns.hidden = false;
        } else {
          np.hidden = true;
          np.innerHTML = '';
          if (ns) ns.hidden = true;
        }
      }
    });
  });
}

function syncAccountUI(g, a) {
  const root = document.getElementById('root');
  const key = g.id + '|' + a.id;
  const done = isDone(a);
  const weekDone = isWeekDone(a);
  const monthDone = isMonthDone(a);
  const acc = root.querySelector(`[data-aid="${key}"]`);
  if (acc) acc.classList.toggle('done', done);
  const bd = root.querySelector(`[data-bdaily="${key}"]`);
  const bw = root.querySelector(`[data-bweek="${key}"]`);
  const bm = root.querySelector(`[data-bmonth="${key}"]`);
  if (bd) bd.hidden = !done;
  if (bw) bw.hidden = !weekDone;
  if (bm) bm.hidden = !monthDone;
  [['daily','d'],['weekly','w'],['monthly','m']].forEach(([field, prefix]) => {
    (a[field]||[]).forEach((c, i) => {
      if (!c.label) return;
      const lab = root.querySelector(`[data-ci="${key}|${prefix}|${i}"]`);
      if (!lab) return;
      const inp = lab.querySelector('input');
      if (inp && inp.checked !== !!c.done) inp.checked = !!c.done;
      lab.classList.toggle('done', !!c.done);
    });
  });
}

document.getElementById('root').addEventListener('change', e => {
  const t = e.target.dataset.t; if (!t) return;
  const [gid, aid, type, idx] = t.split('|');
  const g = state.games.find(x => x.id === gid);
  const a = g.accounts.find(x => x.id === aid);
  const map = { d: 'daily', w: 'weekly', m: 'monthly' };
  const list = a[map[type]];
  list[+idx].done = !list[+idx].done;
  save(state);
  syncAccountUI(g, a);
  syncGameHeader(g);
});

function toggleGame(id) {
  if (!id) return;
  gameOpen[id] = !gameOpen[id];
  const el = document.querySelector('[data-gid="' + id + '"]');
  if (el) el.classList.toggle('open', !!gameOpen[id]);
}

function toggleAcc(key) {
  if (!key) return;
  const willOpen = !accOpen[key];
  accOpen[key] = willOpen;
  if (willOpen) {
    const [gid, aid] = key.split('|');
    const g = state.games.find(x => x.id === gid);
    const a = g && g.accounts.find(x => x.id === aid);
    if (g && a) ensureAccBody(g, a);
  }
  const el = document.querySelector('[data-aid="' + key + '"]');
  if (el) el.classList.toggle('open', willOpen);
}

document.getElementById('root').addEventListener('click', e => {
  // メモ・編集ボタンは先に処理（アカウント展開と分離）
  const nt = e.target.closest('[data-note]');
  if (nt) {
    e.preventDefault();
    e.stopPropagation();
    const [gid, aid] = nt.dataset.note.split('|');
    const g = state.games.find(x => x.id === gid);
    const a = g.accounts.find(x => x.id === aid);
    noteTarget = { gid, aid };
    document.getElementById('nTitle').textContent = a.name + ' のメモ';
    document.getElementById('notes').value = a.note || '';
    document.getElementById('nModal').classList.add('show');
    return;
  }
  const ea = e.target.closest('[data-ea]');
  if (ea) {
    e.preventDefault();
    e.stopPropagation();
    const [gid,aid] = ea.dataset.ea.split('|');
    openA(gid, aid);
    return;
  }
  // ⚙️ ゲーム設定
  const eg = e.target.closest('[data-eg]');
  if (eg) {
    e.preventDefault();
    e.stopPropagation();
    openG(eg.dataset.eg);
    return;
  }
  // ゲーム展開
  const tog = e.target.closest('[data-toggle]');
  if (tog) {
    e.preventDefault();
    e.stopPropagation();
    toggleGame(tog.dataset.toggle);
    return;
  }
  // アカウント展開（バー全体）
  const at = e.target.closest('[data-atoggle]');
  if (at) {
    e.preventDefault();
    e.stopPropagation();
    toggleAcc(at.dataset.atoggle);
    return;
  }
  const eall = e.target.closest('[data-eall]');
  if (eall) {
    e.preventDefault();
    e.stopPropagation();
    const gid = eall.dataset.eall;
    const g = state.games.find(x => x.id === gid);
    if (!g) return;
    const accs = g.accounts || [];
    const allOpen = accs.length > 0 && accs.every(a => accOpen[g.id + '|' + a.id]);
    accs.forEach(a => {
      const key = g.id + '|' + a.id;
      if (allOpen) {
        accOpen[key] = false;
        const el = document.querySelector('[data-aid="' + key + '"]');
        if (el) el.classList.remove('open');
      } else {
        accOpen[key] = true;
        ensureAccBody(g, a);
        const el = document.querySelector('[data-aid="' + key + '"]');
        if (el) el.classList.add('open');
      }
    });
    eall.textContent = allOpen ? '全展開' : '全閉じて';
    return;
  }
  const aa = e.target.closest('[data-aa]');
  if (aa) { openA(aa.dataset.aa); return; }
});

document.getElementById('fab').onclick = () => openG();
document.getElementById('nCancel').onclick = () => document.getElementById('nModal').classList.remove('show');
document.getElementById('nClear').onclick = () => {
  document.getElementById('notes').value = '';
  document.getElementById('notes').focus();
};
document.getElementById('nSave').onclick = () => {
  if (!noteTarget) return;
  const g = state.games.find(x => x.id === noteTarget.gid);
  const a = g.accounts.find(x => x.id === noteTarget.aid);
  a.note = document.getElementById('notes').value;
  save(state);
  document.getElementById('nModal').classList.remove('show');
  // 全体 render せず、このアカウントの見出しだけ更新
  const key = noteTarget.gid + '|' + noteTarget.aid;
  const root = document.getElementById('root');
  const noteLines = (a.note || '').trim().split(/\n/);
  const noteHead = noteLines[0] || '';
  const noteRest = noteLines.slice(1).join(' ').trim();
  const an = root.querySelector('[data-anote="' + key + '"]');
  if (an) {
    if (noteHead) { an.hidden = false; an.textContent = '📝 ' + noteHead; }
    else { an.hidden = true; an.textContent = ''; }
  }
  const body = root.querySelector('[data-abody="' + key + '"]');
  if (body && body.dataset.ready === '1') {
    const np = root.querySelector('[data-noteprev="' + key + '"]');
    const ns = root.querySelector('[data-notesep="' + key + '"]');
    if (np) {
      if (noteHead) {
        np.hidden = false;
        np.innerHTML = '<strong>📝 ' + escape(noteHead) + '</strong>' + (noteRest ? ' — ' + escape(noteRest.slice(0, 40)) : '');
        if (ns) ns.hidden = false;
      } else {
        np.hidden = true; np.innerHTML = '';
        if (ns) ns.hidden = true;
      }
    }
  }
};

function setResetFieldsEnabled(g) {
  const hasW = g ? gameHasWeekly(g) : false;
  const hasM = g ? gameHasMonthly(g) : false;
  document.getElementById('gWDay').disabled = !hasW;
  document.getElementById('gWTime').disabled = !hasW;
  document.getElementById('gWeeklyHint').hidden = hasW;
  document.getElementById('gMDay').disabled = !hasM;
  document.getElementById('gMTime').disabled = !hasM;
  document.getElementById('gMonthlyHint').hidden = hasM;
}

function openG(id = null) {
  editG = id;
  document.getElementById('gTitle').textContent = id ? 'ゲームを編集' : 'ゲームを追加';
  document.getElementById('gDelZone').style.display = id ? 'block' : 'none';
  if (id) {
    const g = state.games.find(x => x.id === id);
    document.getElementById('gName').value = g.name;
    document.getElementById('gDaily').value = g.dailyReset || '05:00';
    document.getElementById('gWDay').value = g.weeklyDay ?? 1;
    document.getElementById('gWTime').value = g.weeklyReset || '05:00';
    document.getElementById('gMDay').value = g.monthlyDay ?? 1;
    document.getElementById('gMTime').value = g.monthlyReset || '05:00';
    setResetFieldsEnabled(g);
  } else {
    document.getElementById('gName').value = '';
    document.getElementById('gDaily').value = '05:00';
    document.getElementById('gWDay').value = '1';
    document.getElementById('gWTime').value = '05:00';
    document.getElementById('gMDay').value = '1';
    document.getElementById('gMTime').value = '05:00';
    setResetFieldsEnabled(null);
  }
  document.getElementById('gModal').classList.add('show');
}

function openA(gid, aid = null) {
  parentG = gid; editA = aid;
  document.getElementById('aTitle').textContent = aid ? 'アカウントを編集' : 'アカウントを追加';
  document.getElementById('aDelZone').style.display = aid ? 'block' : 'none';
  if (aid) {
    const g = state.games.find(x => x.id === gid);
    const a = g.accounts.find(x => x.id === aid);
    document.getElementById('aName').value = a.name;
    for (let i = 0; i < 5; i++) document.getElementById('d'+(i+1)).value = (a.daily||[])[i]?.label || '';
    for (let i = 0; i < 2; i++) document.getElementById('w'+(i+1)).value = (a.weekly||[])[i]?.label || '';
    for (let i = 0; i < 2; i++) document.getElementById('m'+(i+1)).value = (a.monthly||[])[i]?.label || '';
  } else {
    document.getElementById('aName').value = '';
    for (let i = 1; i <= 5; i++) document.getElementById('d'+i).value = '';
    for (let i = 1; i <= 2; i++) document.getElementById('w'+i).value = '';
    for (let i = 1; i <= 2; i++) document.getElementById('m'+i).value = '';
  }
  document.getElementById('aModal').classList.add('show');
}

document.getElementById('gCancel').onclick = () => document.getElementById('gModal').classList.remove('show');
document.getElementById('aCancel').onclick = () => document.getElementById('aModal').classList.remove('show');

document.getElementById('gSave').onclick = () => {
  const name = document.getElementById('gName').value.trim();
  if (!name) return alert('ゲーム名を入れてね');
  const dailyReset = document.getElementById('gDaily').value;
  const weeklyDay = +document.getElementById('gWDay').value;
  const weeklyReset = document.getElementById('gWTime').value;
  const monthlyDay = Math.min(28, Math.max(1, +document.getElementById('gMDay').value || 1));
  const monthlyReset = document.getElementById('gMTime').value;
  if (editG) {
    const g = state.games.find(x => x.id === editG);
    g.name = name; g.dailyReset = dailyReset;
    if (gameHasWeekly(g)) { g.weeklyDay = weeklyDay; g.weeklyReset = weeklyReset; }
    if (gameHasMonthly(g)) { g.monthlyDay = monthlyDay; g.monthlyReset = monthlyReset; }
  } else {
    state.games.push({
      id: 'g'+Date.now(), name, dailyReset,
      weeklyDay, weeklyReset, monthlyDay, monthlyReset, accounts: []
    });
  }
  save(state);
  document.getElementById('gModal').classList.remove('show');
  render(true);
  scheduleGameResets();
};

document.getElementById('aSave').onclick = () => {
  const name = document.getElementById('aName').value.trim();
  if (!name) return alert('アカウント名を入れてね');
  const daily = [], weekly = [], monthly = [];
  for (let i = 1; i <= 5; i++) daily.push({ label: document.getElementById('d'+i).value.trim(), done: false });
  for (let i = 1; i <= 2; i++) weekly.push({ label: document.getElementById('w'+i).value.trim(), done: false });
  for (let i = 1; i <= 2; i++) monthly.push({ label: document.getElementById('m'+i).value.trim(), done: false });
  const g = state.games.find(x => x.id === parentG);
  if (editA) {
    const a = g.accounts.find(x => x.id === editA);
    a.name = name;
    a.daily = daily.map((c,i) => { const o = (a.daily||[])[i]; return { label: c.label, done: (o && o.label === c.label) ? o.done : false }; });
    a.weekly = weekly.map((c,i) => { const o = (a.weekly||[])[i]; return { label: c.label, done: (o && o.label === c.label) ? o.done : false }; });
    a.monthly = monthly.map((c,i) => { const o = (a.monthly||[])[i]; return { label: c.label, done: (o && o.label === c.label) ? o.done : false }; });
  } else {
    g.accounts.push({ id: 'a'+Date.now(), name, daily, weekly, monthly, note: '' });
  }
  save(state);
  document.getElementById('aModal').classList.remove('show');
  render(true);
  scheduleGameResets();
};

document.getElementById('gDel').onclick = () => {
  if (!confirm('このゲームを削除する？')) return;
  state.games = state.games.filter(g => g.id !== editG);
  save(state);
  document.getElementById('gModal').classList.remove('show');
  render(true);
  scheduleGameResets();
};
document.getElementById('aDel').onclick = () => {
  if (!confirm('このアカウントを削除する？')) return;
  const g = state.games.find(x => x.id === parentG);
  g.accounts = g.accounts.filter(a => a.id !== editA);
  save(state);
  document.getElementById('aModal').classList.remove('show');
  render(true);
  scheduleGameResets();
};

// ---- リセット予約（ゲーム単位・次の境界に1回だけ）----
const resetTimers = new Map();

function msUntilDaily(g, now = Date.now()) {
  const [h, m] = (g.dailyReset || '05:00').split(':').map(Number);
  const d = new Date(now);
  const next = new Date(d);
  next.setHours(h || 5, m || 0, 0, 0);
  if (next <= d) next.setDate(next.getDate() + 1);
  return next - d;
}
function msUntilWeekly(g, now = Date.now()) {
  const [h, m] = (g.weeklyReset || '05:00').split(':').map(Number);
  const day = g.weeklyDay ?? 1;
  const d = new Date(now);
  const next = new Date(d);
  next.setHours(h || 5, m || 0, 0, 0);
  let add = (day - next.getDay() + 7) % 7;
  if (add === 0 && next <= d) add = 7;
  next.setDate(next.getDate() + add);
  return next - d;
}
function msUntilMonthly(g, now = Date.now()) {
  const [h, m] = (g.monthlyReset || '05:00').split(':').map(Number);
  const dom = Math.min(28, Math.max(1, g.monthlyDay ?? 1));
  const d = new Date(now);
  let y = d.getFullYear(), mo = d.getMonth();
  const last = new Date(y, mo + 1, 0).getDate();
  let next = new Date(y, mo, Math.min(dom, last), h || 5, m || 0, 0, 0);
  if (next <= d) {
    mo += 1;
    if (mo > 11) { mo = 0; y += 1; }
    const last2 = new Date(y, mo + 1, 0).getDate();
    next = new Date(y, mo, Math.min(dom, last2), h || 5, m || 0, 0, 0);
  }
  return next - d;
}

function clearResetTimers() {
  resetTimers.forEach(id => clearTimeout(id));
  resetTimers.clear();
}

function scheduleGameResets() {
  clearResetTimers();
  const MAX = 2147483647; // setTimeout上限
  state.games.forEach(g => {
    const arm = (kind, ms) => {
      const wait = Math.max(500, Math.min(ms + 50, MAX));
      const tid = setTimeout(() => {
        if (applyResets(state)) {
          save(state);
          render(false);
        }
        scheduleGameResets(); // 次の境界を再予約
      }, wait);
      resetTimers.set(g.id + ':' + kind, tid);
    };
    arm('d', msUntilDaily(g));
    if (gameHasWeekly(g)) arm('w', msUntilWeekly(g));
    if (gameHasMonthly(g)) arm('m', msUntilMonthly(g));
  });
}

// 起動時だけ：閉じてる間に過ぎた境界を反映
if (applyResets(state)) save(state);
render(true);
scheduleGameResets();
