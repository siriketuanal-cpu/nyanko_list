<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>にゃんこチェック</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0d0d12;--card:#16161f;--line:#6a6a7a;--neon:#ff2d6a;--neon2:#00f0ff;--neon3:#c9a0ff;--week:#5ee0a0;--done:#c8ff68;--text:#e8e8f0;--muted:#8888a0;--month:#ffa86b;--daily:#7eb0e8;--misc:#e8d9a8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overscroll-behavior:none;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{padding:10px 12px 80px;max-width:480px;margin:0 auto;line-height:1.4}
.title-row{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:8px;min-height:1.6em}
.title-row h1{margin:0;font-size:1.15rem;color:var(--neon);text-shadow:0 0 10px rgba(255,45,106,.45)}
.ver{position:absolute;right:0;top:50%;transform:translateY(-50%);font:700 .6rem/1 ui-monospace,monospace;color:var(--neon3);text-decoration:none;opacity:.75;padding:2px 5px;border:1px solid #3a2a4a;border-radius:5px;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;cursor:pointer}
.ver:active{color:var(--neon2);border-color:var(--neon2)}
.game{background:var(--card);border:1px solid rgba(106,106,122,.55);border-radius:12px;margin-bottom:10px;overflow:visible}
.ghead{display:flex;align-items:center;gap:6px;padding:4px 10px;background:linear-gradient(90deg,#1a1220,#12121a);border-bottom:1px solid rgba(106,106,122,.45);border-radius:12px 12px 0 0}
.gname{font-weight:700;color:var(--neon);font-size:.95rem;flex-shrink:0;max-width:48%;padding:6px 4px 6px 0}
.gexpand{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:6px;min-height:40px;min-width:48px;padding:6px 2px;user-select:none}
.gmeta{font-size:.62rem;color:var(--muted);text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:4px;flex-wrap:wrap}
.gmeta .badge{font-size:.55rem}
.gbody{display:block;padding-bottom:2px;overflow:visible}
.gtools{padding:2px 8px 4px}
.gtools-toggle{display:block;width:100%;padding:4px 0;border:none;background:transparent;color:var(--muted);font-size:.7rem;letter-spacing:.2em;cursor:pointer;opacity:.5;-webkit-tap-highlight-color:transparent}
.gtools-toggle:active{opacity:.9;color:var(--neon3)}
.gactions{display:none;grid-template-columns:1fr 1fr;align-items:center;gap:6px;padding:4px 0 2px}
.gtools.open .gactions{display:grid}
.gtools.open .gtools-toggle{opacity:.85;color:var(--neon3)}
.gactions .ggear{justify-self:start}
.gactions .gaa{justify-self:end;font-size:.75rem;color:var(--muted);background:none;border:none;cursor:pointer;padding:4px 2px}
.gactions .gaa:active{color:var(--neon2)}
.ib{background:none;border:none;color:var(--muted);font-size:.85rem;cursor:pointer;padding:4px}
.ib:active{color:var(--neon2)}
.acc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:6px 6px 2px;align-items:start;overflow:visible}
.acc{background:#12121a;border:1px solid rgba(106,106,122,.65);border-radius:12px;padding:0;min-width:0;position:relative;contain:layout style}
#focusDim{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:20;display:none;pointer-events:auto}
body.focus-mode .acc.open{z-index:40}
body.focus-mode .fab{z-index:10}
body.focus-mode #focusDim{display:block}
.acc.open{z-index:12;border-color:#8a8aa0;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.ahead{display:flex;align-items:flex-start;gap:4px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;padding:7px 8px;border-radius:11px}
.ainfo{min-width:0;flex:1;overflow:hidden}
.aname{font-weight:600;color:var(--neon3);font-size:.85rem;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:4px;min-width:0;width:100%;min-height:1.25em}
.aname-text{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc.daily-ok .aname-text{color:var(--daily);border-bottom:1px solid rgba(126,176,232,.35)}
.abadges{display:flex;flex-wrap:nowrap;align-items:center;justify-content:flex-end;gap:2px;flex:0 0 auto;margin-left:auto;min-height:1.2em}
.abadges .badge[hidden]{visibility:hidden;pointer-events:none}
.anote{font-size:.68rem;font-weight:600;color:#f4f4f7;margin-top:3px;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;min-height:2.4em;line-height:1.2em;width:100%;max-width:100%;padding-right:4px;box-sizing:border-box}
.anote:empty::before{content:"\00a0"}
.abody-foot{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:6px;border-top:1px solid rgba(255,255,255,.06)}
.abody-edit{border:none;background:transparent;color:var(--muted);font-size:.8rem;cursor:pointer;padding:4px 6px;opacity:.4;line-height:1}
.abody-foot .memo{font-size:.95rem;padding:6px 10px;opacity:.85;background:transparent;border:none;cursor:pointer;line-height:1;margin-left:auto}
.abody-edit:active,.abody-foot .memo:active{color:var(--neon3);opacity:1}
.badge{font-size:.52rem;background:var(--daily);color:#0d0d12;padding:1px 4px;border-radius:4px;font-weight:700;line-height:1.2;flex-shrink:0}
.badge.complete{font-size:.52rem;letter-spacing:.03em;padding:2px 5px;background:var(--done);color:#11190a;border:1px solid rgba(190,255,100,.7);box-shadow:0 0 6px rgba(190,255,100,.22)}
.badge.week{background:var(--week);color:#0d1a12}
.badge.month{background:var(--month);color:#1a1008}
.chip-sec{margin-bottom:0;min-width:0}
.chip-sec:last-of-type{margin-bottom:0}
.chip-label{font-size:.58rem;font-weight:700;letter-spacing:.03em;margin-bottom:4px;opacity:.95}
.chip-label.d{color:var(--daily)}
.chip-label.w{color:var(--week)}
.chip-label.m{color:var(--month)}
.chip-label.x{color:var(--misc)}
.abody > .chip-sec{display:flex;flex-direction:column;min-width:0}
.abody > .chip-sec .chip-label{flex:0 0 auto}
.abody > .chip-sec .chip-row{display:flex;flex-direction:column;gap:6px;min-width:0}
.abody > .chip-sec{min-height:0}
/* その他チェック：3列グリッドの下に横幅いっぱいの独立した折り返し行として配置 */
.abody > .chip-sec.x{grid-column:1/-1;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06)}
.abody > .chip-sec.x .chip-row{flex-direction:row;flex-wrap:wrap}
.abody > .chip-sec.x .chip{width:auto;flex:0 1 auto;max-width:100%}
.abody{display:grid;visibility:hidden;opacity:0;pointer-events:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:8px;background:#12121a;border:1px solid #9a9aac;border-radius:12px;position:absolute;left:0;top:calc(100% + 4px);width:calc(200% + 8px);z-index:13;box-shadow:0 8px 20px rgba(0,0,0,.4);contain:layout paint style;box-sizing:border-box}
.acc.open .abody{visibility:visible;opacity:1;pointer-events:auto}
.acc:nth-child(even) .abody{left:calc(-100% - 8px)}
.chip{display:block;width:100%;text-align:left;border:1px solid #5a5a72;background:#14141e;color:var(--text);border-radius:8px;padding:9px 10px;font-size:.78rem;font-weight:500;line-height:1.35;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{background:#242430;border-color:#4a4a5a;color:var(--text);text-decoration:line-through}
.chip.d.on{background:#1a3145;border-color:#3a6a95;color:var(--daily);text-decoration:line-through}
.chip.w.on{background:#163528;border-color:#2a6a48;color:var(--week)}
.chip.m.on{background:#3a2818;border-color:#7a5a30;color:#ffd0a8}
.chip.x.on{background:#3a3220;border-color:#7a6a45;color:var(--misc);text-decoration:line-through}
.chip.pending{outline:2px dashed var(--neon);outline-offset:-2px}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.fab{position:fixed;right:12px;bottom:14px;width:36px;height:36px;border-radius:50%;border:1px solid #3a2a3a;background:#16161f;color:var(--muted);font-size:1.15rem;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.35);z-index:50;cursor:pointer;opacity:.55}
.fab:active{transform:scale(.94);opacity:.9;color:var(--neon);border-color:var(--neon)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.mb{background:#14141e;width:100%;max-width:480px;border-radius:14px 14px 0 0;padding:14px;max-height:90vh;overflow-y:auto;border-top:1px solid var(--neon)}
.mb h2{color:var(--neon);font-size:1rem;margin-bottom:8px}
input[type=text],input[type=time],input[type=number],select,textarea{width:100%;padding:8px;border:1px solid #2a2a3a;border-radius:8px;background:#0d0d14;color:var(--text);font-size:.9rem;margin-bottom:7px;font-family:inherit;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
input:disabled,select:disabled{opacity:.4}
textarea{min-height:160px;resize:vertical}
label.s{font-size:.7rem;color:var(--muted);display:block;margin-bottom:2px}
.row{display:flex;gap:6px;margin-bottom:7px}.row>*{flex:1}
.btns{display:flex;gap:6px;margin-top:10px}
button.save,button.cancel{flex:1;padding:10px;border:none;border-radius:8px;font-size:.9rem;cursor:pointer}
.save{background:var(--neon);color:#fff}.cancel{background:#222230;color:var(--text)}
.danger-zone{margin-top:12px;padding-top:12px;border-top:1px solid #3a2030}
.danger{background:#3a1520;color:#ff6b8a;width:100%;padding:10px;border:1px solid #5a2030;border-radius:8px;cursor:pointer}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:5px}.g2 label.s{grid-column:1/-1}
.hint{font-size:.65rem;color:var(--muted);margin:-4px 0 8px}
.nhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.nhead h2{margin:0;flex:1;min-width:0}
.nclear{flex-shrink:0;font-size:.62rem;padding:4px 8px;border-radius:6px;border:1px solid #3a2030;background:#1a1018;color:#ff8aa8;cursor:pointer}
.nclear:active{background:#2a1520}
#nModal{align-items:initial;justify-content:initial;background:transparent}
#nModal .mb{position:fixed;left:var(--note-left,12px);top:var(--note-top,80px);width:min(92vw,420px);max-width:none;max-height:min(70vh,520px);border-radius:14px;border:1px solid var(--neon);box-shadow:0 10px 30px rgba(0,0,0,.5);transform:none}
#nModal.show .mb{display:block}
</style>
</head>
<body>

<div class="title-row">
  <h1>♡ にゃんこチェック ♡</h1>
  <span class="ver" role="link" tabindex="0" title="タップで最新版に更新">v0.5.43</span>
</div>
<div id="root"></div>
<div id="focusDim" aria-hidden="true"></div>
<button class="fab" id="fab" title="ゲームを追加">＋</button>

<div class="modal" id="gModal">
  <div class="mb">
    <h2 id="gTitle">ゲームを追加</h2>
    <label class="s">ゲーム名</label>
    <input type="text" id="gName" placeholder="例：原神">
    <label class="s">日課リセット時刻</label>
    <input type="time" id="gDaily" value="05:00">
    <div id="gWeeklyBlock">
      <label class="s">週課リセット（曜日＋時刻）</label>
      <div class="row">
        <select id="gWDay">
          <option value="1">月曜</option><option value="2">火曜</option><option value="3">水曜</option>
          <option value="4">木曜</option><option value="5">金曜</option><option value="6">土曜</option><option value="0">日曜</option>
        </select>
        <input type="time" id="gWTime" value="05:00">
      </div>
      <p class="hint" id="gWeeklyHint" hidden>ウィークリー未設定のため変更できません</p>
    </div>
    <div id="gMonthlyBlock">
      <label class="s">月課リセット（日付＋時刻）</label>
      <div class="row">
        <input type="number" id="gMDay" min="1" max="31" value="1" placeholder="日">
        <input type="time" id="gMTime" value="05:00">
      </div>
      <p class="hint" id="gMonthlyHint" hidden>マンスリー未設定のため変更できません</p>
    </div>
    <div class="btns">
      <button class="cancel" id="gCancel">キャンセル</button>
      <button class="save" id="gSave">保存</button>
    </div>
    <div class="danger-zone" id="gDelZone" style="display:none">
      <button class="danger" id="gDel">このゲームを削除</button>
    </div>
  </div>
</div>

<div class="modal" id="aModal">
  <div class="mb">
    <h2 id="aTitle">アカウントを追加</h2>
    <label class="s">アカウント名</label>
    <input type="text" id="aName" placeholder="例：本アカ">
    <div class="g2">
      <label class="s">デイリー（空欄は非表示・最大5）</label>
      <input type="text" id="d1" placeholder="①"><input type="text" id="d2" placeholder="②">
      <input type="text" id="d3" placeholder="③"><input type="text" id="d4" placeholder="④">
      <input type="text" id="d5" placeholder="⑤">
    </div>
    <div class="g2">
      <label class="s">ウィークリー（空欄は非表示・最大2）</label>
      <input type="text" id="w1" placeholder="①"><input type="text" id="w2" placeholder="②">
    </div>
    <div class="g2">
      <label class="s">マンスリー（空欄は非表示・最大2）</label>
      <input type="text" id="m1" placeholder="①"><input type="text" id="m2" placeholder="②">
    </div>
    <div class="g2">
      <label class="s">その他（自動リセットなし・空欄は非表示・最大5）</label>
      <input type="text" id="x1" placeholder="①"><input type="text" id="x2" placeholder="②">
      <input type="text" id="x3" placeholder="③"><input type="text" id="x4" placeholder="④">
      <input type="text" id="x5" placeholder="⑤">
    </div>
    <div class="btns">
      <button class="cancel" id="aCancel">キャンセル</button>
      <button class="save" id="aSave">保存</button>
    </div>
    <div class="danger-zone" id="aDelZone" style="display:none">
      <button class="danger" id="aDel">このアカウントを削除</button>
    </div>
  </div>
</div>

<div class="modal" id="nModal">
  <div class="mb">
    <div class="nhead">
      <h2 id="nTitle">アカウントメモ</h2>
      <button type="button" class="nclear" id="nClear" title="メモをすべて消す">オールクリア</button>
    </div>
    <textarea id="notes" placeholder="このアカウント用のメモ…"></textarea>
    <div class="btns">
      <button class="cancel" id="nCancel">閉じる</button>
      <button class="save" id="nSave">保存</button>
    </div>
  </div>
</div>

<script type="module" src="./app.mjs"></script>

</body>
</html>
